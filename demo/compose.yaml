services:
  backend:
    image: node:23-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: npx json-server /app/db.json --host 0.0.0.0 --port 8000

  frontend:
    image: node:23-alpine
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000"
    command: sh -c "npm install && npm run dev"
